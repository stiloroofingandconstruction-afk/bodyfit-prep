<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Sin `user-scalable=no` ni `maximum-scale`: bloquear el zoom impide que
      quien tiene baja vision amplie el contenido, y ademas iOS lo ignora desde
      hace anos. El zoom por doble toque se evita con `touch-action: manipulation`
      en el CSS, que no penaliza la accesibilidad.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BodyFit Prep</title>
    <meta name="description" content="Entrenamiento, nutricion inteligente y seguimiento fisico" />

    <!-- iOS / Safari: comportamiento de app nativa -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BodyFit" />
    <meta name="theme-color" content="#0B0F14" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
